		<script id="manman-content-controller">(function(global){
  'use strict';
  if(global.manmanContent)return;
  const jobs=new Map(),prefetched=new Set(),paused=new Set();
  let active=null,prefetchPromise=null,prefetchAbort=null,prefetchTransfer=null;
  let background={state:'idle',completed:0,total:0,failed:[]};
  const report=state=>{background={...background,...state};global.manmanBoot.note?.('backgroundPrefetch',background);};
  const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function drain(response){
    if(!response.ok)throw Error('HTTP '+response.status);
    if(!response.body){await response.arrayBuffer();return;}
    const reader=response.body.getReader();
    try{while(true){const part=await reader.read();if(part.done)break;}}
    finally{reader.releaseLock();}
  }
  function optionalIds(){
    const manifest=global.manmanContentManifest||{};
    const required=new Set(manifest.required||[]);
    const result=[],seen=new Set();
    const add=id=>{if(!required.has(id)&&manifest.packs?.[id]&&!seen.has(id)){seen.add(id);result.push(id);}};
    for(const resource of ['public_facilities','flora_decor','boats_extra','ambient_audio','creatures_fish','creatures_insects','housing_upgrades'])
      for(const id of manifest.resources?.[resource]||[])add(id);
    for(const id of Object.keys(manifest.packs||{}).sort((a,b)=>(manifest.packs[a].bytes||0)-(manifest.packs[b].bytes||0)))add(id);
    return result;
  }
  global.manmanContent={
    request(id){
      if(jobs.has(id))return;
      if(active!==null)throw Error('Content download budget exceeded');
      const asset=global.manmanContentManifest?.packs[id];
      if(!asset)throw Error('Unknown content pack: '+id);
      const interrupted=prefetchTransfer;
      if(prefetchAbort)prefetchAbort.abort();
      const job={status:'pending',bytes:null,error:null};jobs.set(id,job);active=id;
      (async()=>{
        try{
          // Wait until the cancelled low-priority transfer has yielded its slot.
          if(interrupted)await interrupted.catch(()=>{});
          const downloadStart=performance.now();
          const required=(global.manmanContentManifest.required||[]).includes(id);
          const compressed=await global.manmanBoot.fetchVerified(asset,2,30000,{fatal:required});
          prefetched.add(id);
          global.manmanBoot.measure?.('content.download_verify',performance.now()-downloadStart,{id});
          const inflateStart=performance.now();
          const raw=new Uint8Array(asset.rawBytes);let offset=0;
          const reader=new Response(compressed).body.pipeThrough(new DecompressionStream('gzip')).getReader();
          try{
            while(true){const chunk=await reader.read();if(chunk.done)break;
              if(offset+chunk.value.length>raw.length)throw Error('Inflated content exceeds manifest size');
              raw.set(chunk.value,offset);offset+=chunk.value.length;
            }
          }catch(error){try{await reader.cancel(error);}catch{}throw error;}finally{reader.releaseLock();}
          if(offset!==raw.length)throw Error('Inflated content size mismatch');
          const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',raw)),b=>b.toString(16).padStart(2,'0')).join('');
          if(hash!==asset.rawSha256)throw Error('Inflated content hash mismatch');
          global.manmanBoot.measure?.('content.inflate_verify',performance.now()-inflateStart,{id});
          job.bytes=raw;job.status='ready';
        }catch(error){job.status='error';job.error=String(error);if((global.manmanContentManifest.required||[]).includes(id))global.manmanBoot.fail('CONTENT_PACK',asset.url,String(error));}
      })();
    },
    status(id){const job=jobs.get(id);return job?job.status:'missing';},
    bytes(id){const job=jobs.get(id);if(job?.status!=='ready')throw Error('Content is not verified');return job.bytes;},
    release(id){if(active!==id)throw Error('Content release mismatch');jobs.delete(id);active=null;},
    error(id){return jobs.get(id)?.error||null;},
    pausePrefetch(reason='application'){
      paused.add(reason);prefetchAbort?.abort();
      if(prefetchPromise)report({state:'paused'});
    },
    resumePrefetch(reason='application'){paused.delete(reason);},
    prefetchOptional(){
      if(prefetchPromise)return prefetchPromise;
      prefetchPromise=(async()=>{
        await delay(1200);
        const ids=optionalIds(),failed=[];
        const count=()=>ids.filter(id=>prefetched.has(id)).length;
        report({state:paused.size?'paused':'running',completed:count(),total:ids.length,failed:[]});
        for(let index=0;index<ids.length;){
          while(active!==null||paused.size)await delay(200);
          const id=ids[index],asset=global.manmanContentManifest?.packs[id];
          if(!asset||prefetched.has(id)){index++;continue;}
          const controller=new AbortController();prefetchAbort=controller;
          report({state:'running',id});
          try{
            prefetchTransfer=(async()=>{
              const response=await fetch(asset.url,{cache:'force-cache',signal:controller.signal});
              await drain(response);
            })();
            await prefetchTransfer;
            prefetched.add(id);index++;
            report({completed:count()});
          }catch(error){
            if(controller.signal.aborted){await delay(200);continue;}
            failed.push(id);index++;
          }finally{
            if(prefetchAbort===controller){prefetchAbort=null;prefetchTransfer=null;}
          }
        }

        report({state:failed.length?'partial_failure':'complete',completed:count(),failed});
      })().finally(()=>{prefetchPromise=null;});
      return prefetchPromise;
    },
  };
  if(global.document?.addEventListener){
    const visibility=()=>{if(global.document.hidden)global.manmanContent.pausePrefetch('hidden');else global.manmanContent.resumePrefetch('hidden');};
    global.document.addEventListener('visibilitychange',visibility);visibility();
  }
})(window);
</script>

		<script id="manman-boot-shell">(function () {
  'use strict';
  const boot=window.manmanBoot;
  const overlay=document.getElementById('status');
  const progress=document.getElementById('status-progress');
  const notice=document.getElementById('status-notice');
  const copy=document.getElementById('godot-loading-copy');
  const percentage=document.createElement('span');percentage.id='boot-percent';progress.after(percentage);
  const art=Array.from(document.querySelectorAll('#boot-art img'));
  const backdropArt=Array.from(document.querySelectorAll('#boot-art-backdrop img'));
  const backgrounds=window.manmanLoadingBackgrounds||[];
  const imageCache=new Map();let desiredImage=0,activeImage=0,leaving=false,leaveFinished=false,menuReached=false;
  function background(index){
    desiredImage=index;if(!art.length||!backdropArt.length||!backgrounds[index]||activeImage===index)return;
    let preload=imageCache.get(index);
    if(!preload){preload=new Image();preload.decoding='async';preload.fetchPriority='low';imageCache.set(index,preload);preload.src=backgrounds[index];}
    const show=()=>{
      if(desiredImage!==index||!preload.naturalWidth)return;
      const next=art.find(image=>!image.classList.contains('active'))||art[0];
      const nextBackdrop=backdropArt.find(image=>!image.classList.contains('active'))||backdropArt[0];
      next.src=backgrounds[index];nextBackdrop.src=backgrounds[index];
      for(const image of art)image.classList.toggle('active',image===next);
      for(const image of backdropArt)image.classList.toggle('active',image===nextBackdrop);
      activeImage=index;
    };
    if(preload.complete)show();else preload.onload=show;
    preload.onerror=()=>boot.note('backgroundFailure',backgrounds[index]);
  }
  const controls=document.createElement('div');
  controls.id='boot-error-controls';controls.hidden=true;
  const retry=document.createElement('button');retry.textContent='重試';
  const diagnostics=document.createElement('button');diagnostics.textContent='複製診斷';
  const diagnosticText=document.createElement('textarea');
  diagnosticText.readOnly=true;diagnosticText.hidden=true;
  diagnosticText.setAttribute('aria-label','啟動診斷');
  controls.append(retry,diagnostics,diagnosticText);notice.after(controls);
  let retryRequested=false;
  // The only reload is a deliberate user action on the visible error screen.
  retry.addEventListener('click',()=>{
    if(retryRequested)return;retryRequested=true;retry.disabled=true;
    try{sessionStorage.setItem('manman.boot.userRetry',boot.snapshot().attempt);}catch{}
    // A restored/cached shell may reference hashed files retired by a deploy.
    // A fresh navigation URL bypasses that shell without touching saved islands.
    const fresh=new URL(window.location.href);
    fresh.searchParams.set('retryBuild',boot.snapshot().build||boot.snapshot().attempt);
    fresh.searchParams.set('reload',String(Date.now()));
    window.location.replace(fresh.href);
  });
  diagnostics.addEventListener('click',async()=>{
    const value=JSON.stringify(boot.snapshot(),null,2);
    try{await navigator.clipboard.writeText(value);diagnostics.textContent='已複製';}
    catch{diagnosticText.value=value;diagnosticText.hidden=false;diagnosticText.focus();diagnosticText.select();}
  });
  const labels={BOOT:'正在準備啟動…',DOWNLOAD:'正在下載必要內容…',ENGINE:'正在解壓與啟動引擎…',WORLD:'正在準備世界、角色與操作…',PLAYABLE:'準備完成，歡迎來到慢慢島！'};
  boot.subscribe(state=>{
    overlay.style.visibility='visible';
		if(state.menuReady===true)menuReached=true;
		if(menuReached&&state.stage!=='ERROR'){
			overlay.hidden=true;
			overlay.classList.remove('awaiting-input');
			return;
		}
    if(state.stage==='ERROR'||state.contentBusy){overlay.hidden=false;overlay.classList.remove('leaving');}
    else if(state.playable&&leaveFinished){overlay.hidden=true;}
    else if(state.playable&&!leaving){
      leaving=true;background(3);
      overlay.classList.add('leaving');
      setTimeout(()=>{leaveFinished=true;const latest=boot.snapshot();if(latest.stage!=='ERROR'&&!latest.contentBusy)overlay.hidden=true;},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:250);
    }
    if(!state.playable)background(state.stage==='ENGINE'?1:state.stage==='WORLD'?2:0);
    if(state.stage==='WORLD'&&backgrounds[3]&&!imageCache.has(3)){
      const finalImage=new Image();finalImage.decoding='async';finalImage.fetchPriority='low';
      imageCache.set(3,finalImage);finalImage.src=backgrounds[3];
    }
    overlay.classList.toggle('awaiting-input',!!state.awaitingInput&&!state.contentBusy&&state.stage!=='ERROR');
    progress.max=100;progress.value=state.percent;
    percentage.textContent=state.percent+'%';
    progress.style.display=state.stage==='ERROR'||(state.playable&&state.contentBusy)?'none':'block';
    percentage.hidden=state.playable&&state.contentBusy;
		copy.textContent=state.playable&&state.contentBusy?'正在背景準備這次需要的內容…':(labels[state.stage]||'啟動失敗');
    progress.setAttribute('aria-label',`${copy.textContent} ${state.percent}%`);
    controls.hidden=state.stage!=='ERROR';
    notice.style.display=state.stage==='ERROR'?'block':'none';
    if(state.error){
      const stages={BOOT:'啟動',DOWNLOAD:'必要內容下載',ENGINE:'引擎啟動',WORLD:'世界準備'};
      const messages={HASH_MISMATCH:'下載內容與版本不符，請重試。',SIZE_MISMATCH:'下載內容不完整，請重試。',DOWNLOAD_STALLED:'網路傳輸已停止回應，請確認連線後重試。',HTTP_404:'頁面可能保留舊版本，請按「重試」重新載入最新遊戲。存檔會保留。'};
      notice.textContent=`${stages[state.error.stage]||state.error.stage}失敗（${state.error.code}）：${messages[state.error.code]||state.error.message||'無法完成載入，請重試。'}${state.error.resource?'\n資源：'+state.error.resource:''}`;
      notice.setAttribute('role','alert');
    }
  });
})();
</script>
		<script id="manman-engine-start">(function () {

    if(missing.length){boot.fail('MISSING_BROWSER_FEATURE','','瀏覽器缺少必要功能：'+missing.join('、'));return;}
