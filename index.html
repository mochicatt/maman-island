		<script id="manman-content-controller">(function(global){
  'use strict';
  if(global.manmanContent)return;
  const jobs=new Map(),prefetched=new Set(),paused=new Set();
  let active=null,prefetchPromise=null,prefetchAbort=null,prefetchTransfer=null;
  let background={state:'idle',completed:0,total:0,failed:[]};
  const report=state=>{background={...background,...state};global.manmanBoot.note?.('backgroundPrefetch',background);};
  const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function drain(response){
    if(!response.ok)throw Error('HTTP '+response.status);
    if(!response.body){await response.arrayBuffer();return;}
    const reader=response.body.getReader();
    try{while(true){const part=await reader.read();if(part.done)break;}}
    finally{reader.releaseLock();}
  }
  function optionalIds(){
    const manifest=global.manmanContentManifest||{};
    const required=new Set(manifest.required||[]);
    const result=[],seen=new Set();
    const add=id=>{if(!required.has(id)&&manifest.packs?.[id]&&!seen.has(id)){seen.add(id);result.push(id);}};
    for(const resource of ['public_facilities','flora_decor','boats_extra','ambient_audio','creatures_fish','creatures_insects','housing_upgrades'])
      for(const id of manifest.resources?.[resource]||[])add(id);
    for(const id of Object.keys(manifest.packs||{}).sort((a,b)=>(manifest.packs[a].bytes||0)-(manifest.packs[b].bytes||0)))add(id);
    return result;
  }
  global.manmanContent={
    request(id){
      if(jobs.has(id))return;
      if(active!==null)throw Error('Content download budget exceeded');
      const asset=global.manmanContentManifest?.packs[id];
      if(!asset)throw Error('Unknown content pack: '+id);
      const interrupted=prefetchTransfer;
      if(prefetchAbort)prefetchAbort.abort();
      const job={status:'pending',bytes:null,error:null};jobs.set(id,job);active=id;
      (async()=>{
        try{
          // Wait until the cancelled low-priority transfer has yielded its slot.
          if(interrupted)await interrupted.catch(()=>{});
          const downloadStart=performance.now();
          const required=(global.manmanContentManifest.required||[]).includes(id);
          const compressed=await global.manmanBoot.fetchVerified(asset,2,30000,{fatal:required});
          prefetched.add(id);

          const inflateStart=performance.now();

    resumePrefetch(reason='application'){paused.delete(reason);},

		<script id="manman-boot-shell">(function () {

  const percentage=document.createElement('span');percentage.id='boot-percent';progress.after(percentage);
  const art=Array.from(document.querySelectorAll('#boot-art img'));
  const backdropArt=Array.from(document.querySelectorAll('#boot-art-backdrop img'));
  const backgrounds=window.manmanLoadingBackgrounds||[];

      next.src=backgrounds[index];nextBackdrop.src=backgrounds[index];
      for(const image of art)image.classList.toggle('active',image===next);
      for(const image of backdropArt)image.classList.toggle('active',image===nextBackdrop);

    if(preload.complete)show();else preload.onload=show;

  }

    catch{diagnosticText.value=value;diagnosticText.hidden=false;diagnosticText.focus();diagnosticText.select();}
  });
  const labels={BOOT:'正在準備啟動…',DOWNLOAD:'正在下載必要內容…',ENGINE:'正在解壓與啟動引擎…',WORLD:'正在準備世界、角色與操作…',PLAYABLE:'準備完成，歡迎來到慢慢島！'};

    else if(state.playable&&!leaving){
      leaving=true;background(3);
      overlay.classList.add('leaving');
      setTimeout(()=>{leaveFinished=true;const latest=boot.snapshot();if(latest.stage!=='ERROR'&&!latest.contentBusy)overlay.hidden=true;},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:250);
    }
    if(!state.playable)background(state.stage==='ENGINE'?1:state.stage==='WORLD'?2:0);
    if(state.stage==='WORLD'&&backgrounds[3]&&!imageCache.has(3)){
      const finalImage=new Image();finalImage.decoding='async';finalImage.fetchPriority='low';
      imageCache.set(3,finalImage);finalImage.src=backgrounds[3];
    }
    overlay.classList.toggle('awaiting-input',!!state.awaitingInput&&!state.contentBusy&&state.stage!=='ERROR');
    progress.max=100;progress.value=state.percent;
    percentage.textContent=state.percent+'%';
    progress.style.display=state.stage==='ERROR'||(state.playable&&state.contentBusy)?'none':'block';
    percentage.hidden=state.playable&&state.contentBusy;
		copy.textContent=state.playable&&state.contentBusy?'正在背景準備這次需要的內容…':(labels[state.stage]||'啟動失敗');
    progress.setAttribute('aria-label',`${copy.textContent} ${state.percent}%`);
    controls.hidden=state.stage!=='ERROR';
    notice.style.display=state.stage==='ERROR'?'block':'none';
    if(state.error){
      const stages={BOOT:'啟動',DOWNLOAD:'必要內容下載',ENGINE:'引擎啟動',WORLD:'世界準備'};
      const messages={HASH_MISMATCH:'下載內容與版本不符，請重試。',SIZE_MISMATCH:'下載內容不完整，請重試。',DOWNLOAD_STALLED:'網路傳輸已停止回應，請確認連線後重試。',HTTP_404:'頁面可能保留舊版本，請按「重試」重新載入最新遊戲。存檔會保留。'};
      notice.textContent=`${stages[state.error.stage]||state.error.stage}失敗（${state.error.code}）：${messages[state.error.code]||state.error.message||'無法完成載入，請重試。'}${state.error.resource?'\n資源：'+state.error.resource:''}`;
      notice.setAttribute('role','alert');
    }
  });
})();
</script>
		<script id="manman-engine-start">(function () {
  'use strict';
  const boot=window.manmanBoot;
  window.manmanStartEngine=function(config,threads){
    if(config.serviceWorker||threads){boot.fail('UNSUPPORTED_EXPORT','','本載入器需要單執行緒、PWA 關閉的匯出。');return;}
    const missing=Engine.getMissingFeatures({threads:false});
    if(missing.length){boot.fail('MISSING_BROWSER_FEATURE','','瀏覽器缺少必要功能：'+missing.join('、'));return;}
    try{boot.configure(window.manmanBootManifest);}catch(error){boot.fail('INVALID_MANIFEST','boot-manifest.json',String(error));return;}
    boot.start(()=>{
      const engine=new Engine(config);
      return engine.startGame({onProgress(){},onPrintError(message){
        console.error(message);
        if(!boot.snapshot().playable&&/^(ERROR|SCRIPT ERROR)/.test(message))boot.fail('GODOT_ERROR','',message);
      }});
    }).then(()=>{boot.note('enginePromiseResolvedAt',performance.now());}).catch(()=>{});
  };
  document.getElementById('canvas').addEventListener('webglcontextlost',event=>{
    event.preventDefault();boot.fail('WEBGL_CONTEXT_LOST','','圖形處理中斷，請重試。存檔仍會保留。');
  });
})();
</script>

	<script id="manman-pwa-registration">
	if ('serviceWorker' in navigator) window.addEventListener('load', function () {
		var register = function () { navigator.serviceWorker.register('./service-worker.js', { scope: './', updateViaCache: 'none' }).catch(function (error) { console.warn('PWA registration failed', error); }); };
		if (!window.manmanBoot || window.manmanBoot.snapshot().playable) { register(); return; }
		var unsubscribe = window.manmanBoot.subscribe(function (state) { if (state.playable) { unsubscribe(); register(); } });
	});
